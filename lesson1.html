<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Lesson | Duolingo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root {
    --color-green: #58CC02;
    --color-green-dark: #46A302;
    --color-green-light: #84D94F;
    --color-blue: #1CB0F6;
    --color-red: #FF4B4B;
    --color-red-dark: #EA2B2B;
    --color-border: #E5E5E5;
    --color-text-main: #3C3C3C;
    --color-text-sub: #777777;
    --font-family: 'Nunito', sans-serif;
  }
  
  body {
    font-family: 'Nunito', sans-serif;
    color: var(--color-text-main);
    background-color: #ffffff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Top Bar Header */
  .lesson-header {
    height: 70px;
    border-bottom: 2px solid var(--color-border);
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
    flex-shrink: 0;
  }
  .close-lesson-btn {
    font-size: 24px;
    color: var(--color-text-sub);
    cursor: pointer;
    background: none;
    border: none;
    transition: color 0.15s ease;
  }
  .close-lesson-btn:hover {
    color: var(--color-text-main);
  }
  .progress-bar-track {
    flex-grow: 1;
    height: 16px;
    background-color: var(--color-border);
    border-radius: 20px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background-color: var(--color-green);
    border-radius: 20px;
    transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .hearts-box {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 20px;
    font-weight: 800;
    color: var(--color-red);
  }

  /* Core Interactive Workspace */
  .lesson-workspace {
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .workspace-card {
    width: 100%;
    max-width: 600px;
    min-height: 380px;
  }
  .exercise-title {
    font-size: 26px;
    font-weight: 900;
    margin-bottom: 30px;
    color: var(--color-text-main);
  }

  /* Multiple Choice Cards styling */
  .choice-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .choice-card {
    border: 2px solid var(--color-border);
    border-radius: 16px;
    padding: 24px 12px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--color-border);
    transition: all 0.15s ease;
    font-weight: 800;
    font-size: 16px;
    background: #ffffff;
    user-select: none;
  }
  .choice-card:hover {
    background-color: #F8F9FA;
  }
  .choice-card.selected {
    border-color: var(--color-blue);
    background-color: #EBF8FF;
    box-shadow: 0 4px 0 var(--color-blue);
    color: var(--color-blue);
  }
  .choice-card-flag {
    font-size: 36px;
    margin-bottom: 12px;
    display: block;
  }

  /* Word Bank Cards styling */
  .word-slot-container {
    border-bottom: 2px solid var(--color-border);
    min-height: 60px;
    padding: 10px;
    margin-bottom: 40px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .word-bank-container {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .word-token {
    border: 2px solid var(--color-border);
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--color-border);
    background-color: #ffffff;
    user-select: none;
    transition: all 0.1s ease;
  }
  .word-token:active {
    transform: translateY(4px);
    box-shadow: 0 0px 0 var(--color-border);
  }
  .word-token.used {
    opacity: 0.3;
    pointer-events: none;
  }

  /* Audio player button styling */
  .audio-drill-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background-color: var(--color-blue);
    border: none;
    color: white;
    font-size: 32px;
    box-shadow: 0 6px 0 #1899D6;
    margin: 0 auto 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .audio-drill-btn:active {
    transform: translateY(6px);
    box-shadow: 0 0px 0 #1899D6;
  }

  /* Matching Pairs grid */
  .matching-pairs-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .matching-card {
    border: 2px solid var(--color-border);
    border-radius: 12px;
    padding: 14px;
    font-weight: 800;
    font-size: 15px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--color-border);
    background-color: #ffffff;
    transition: all 0.1s ease;
  }
  .matching-card.selected {
    border-color: var(--color-blue);
    background-color: #EBF8FF;
    color: var(--color-blue);
    box-shadow: 0 4px 0 var(--color-blue);
  }
  .matching-card.correct {
    border-color: var(--color-green) !important;
    background-color: #E9F7D8 !important;
    color: var(--color-green) !important;
    box-shadow: none !important;
    transform: none !important;
    opacity: 0.6;
    cursor: not-allowed;
  }
  .matching-card.incorrect {
    border-color: var(--color-red) !important;
    background-color: #FEE7E7 !important;
    color: var(--color-red) !important;
    box-shadow: 0 4px 0 var(--color-red) !important;
  }

  /* Bottom Feedback Panel */
  .feedback-panel {
    background-color: #ffffff;
    border-top: 2px solid var(--color-border);
    padding: 30px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 120px;
    flex-shrink: 0;
    transition: background-color 0.2s ease;
  }
  .feedback-message-container {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .feedback-icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    color: #ffffff;
  }
  .feedback-title {
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 2px;
  }
  .feedback-subtitle {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 0;
  }
  
  /* Panel active states */
  .feedback-panel.correct-state {
    background-color: #d7ffb8;
    border-top-color: #d7ffb8;
  }
  .feedback-panel.correct-state .feedback-icon {
    background-color: var(--color-green);
  }
  .feedback-panel.correct-state .feedback-title {
    color: var(--color-green-dark);
  }
  .feedback-panel.correct-state .feedback-subtitle {
    color: var(--color-green-dark);
  }

  .feedback-panel.incorrect-state {
    background-color: #ffdfe0;
    border-top-color: #ffdfe0;
  }
  .feedback-panel.incorrect-state .feedback-icon {
    background-color: var(--color-red);
  }
  .feedback-panel.incorrect-state .feedback-title {
    color: var(--color-red-dark);
  }
  .feedback-panel.incorrect-state .feedback-subtitle {
    color: var(--color-red-dark);
  }

  .check-action-btn {
    min-width: 140px;
    height: 50px;
  }

  /* Lesson End Rewards Screen */
  .splash-screen {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #ffffff;
    z-index: 10000;
    overflow-y: auto;
    padding: 60px 20px;
  }
  .rewards-box {
    border: 2px solid var(--color-border);
    border-radius: 20px;
    padding: 24px;
    background: #F8F9FA;
    margin-bottom: 40px;
  }
  .reward-block {
    text-align: center;
    padding: 10px;
  }
  .reward-val {
    font-size: 28px;
    font-weight: 900;
    color: var(--color-green-dark);
    margin-bottom: 4px;
  }
  .reward-lbl {
    font-size: 13px;
    color: var(--color-text-sub);
    font-weight: 800;
    text-transform: uppercase;
  }
  .mascot-triumph {
    width: 150px;
    display: block;
    margin: 0 auto 30px;
    animation: bounceTriumph 2s infinite alternate;
  }

  @keyframes bounceTriumph {
    0% { transform: translateY(0); }
    100% { transform: translateY(-12px); }
  }

  @media (max-width: 768px) {
    .lesson-header { padding: 0 20px; gap: 15px; }
    .choice-grid { grid-template-columns: 1fr; gap: 10px; }
    .feedback-panel { padding: 20px; flex-direction: column; height: 160px; justify-content: center; gap: 14px; text-align: center; }
    .feedback-message-container { gap: 10px; }
    .feedback-icon { width: 45px; height: 45px; font-size: 20px; }
    .feedback-title { font-size: 17px; }
  }
</style>
</head>
<body>

<!-- Header (Progress bar, Hearts count, Quit button) -->
<header class="lesson-header">
  <button class="close-lesson-btn" id="quitLessonBtn">
    <i class="bi bi-x-lg"></i>
  </button>
  
  <div class="progress-bar-track">
    <div class="progress-bar-fill" id="lessonProgressBarFill"></div>
  </div>
  
  <div class="hearts-box">
    <i class="bi bi-heart-fill"></i>
    <span id="heartsRemainingText">5</span>
  </div>
</header>

<!-- Main Exercise Space -->
<main class="lesson-workspace">
  <div class="workspace-card" id="exerciseContainer">
    <!-- Content injected via jQuery -->
  </div>
</main>

<!-- Slide-up feedback status bar -->
<footer class="feedback-panel" id="feedbackPanel">
  <div class="feedback-message-container" style="display: none;" id="feedbackMsgBlock">
    <div class="feedback-icon" id="feedbackIcon">
      <i class="bi bi-check-lg" id="feedbackIconSymbol"></i>
    </div>
    <div>
      <h4 class="feedback-title" id="feedbackTitleText">Awesome!</h4>
      <p class="feedback-subtitle" id="feedbackSubtitleText">Correct answer matches.</p>
    </div>
  </div>
  <div class="d-none d-md-block" id="feedbackSpacer"></div>
  <button class="btn btn-success btn-duo btn-duo-green check-action-btn" id="actionBtn">
    CHECK
  </button>
</footer>

<!-- Splash Complete Screen -->
<div class="splash-screen" id="completeSplash">
  <div class="container text-center max-w-600">
    <img src="https://cdn-icons-png.flaticon.com/512/616/616430.png" class="mascot-triumph" alt="Duo Owl Champion">
    
    <h1 class="font-weight-black text-success mb-2" style="font-size: 36px;">Lesson Complete!</h1>
    <p class="text-sub fw-semibold mb-5" style="font-size: 18px;">You've taken another major step on your language path.</p>
    
    <div class="rewards-box">
      <div class="row">
        <div class="col-4 reward-block">
          <div class="reward-val text-warning"><i class="bi bi-star-fill"></i> +20</div>
          <div class="reward-lbl">XP Earned</div>
        </div>
        <div class="col-4 reward-block border-start border-end">
          <div class="reward-val text-primary"><i class="bi bi-gem"></i> +5</div>
          <div class="reward-lbl">Gems Reward</div>
        </div>
        <div class="col-4 reward-block">
          <div class="reward-val" style="color: var(--color-orange);"><i class="bi bi-fire"></i> 100%</div>
          <div class="reward-lbl">Accuracy</div>
        </div>
      </div>
    </div>
    
    <button class="btn btn-success btn-lg btn-duo btn-duo-green px-5 py-3 fs-5" id="completeSplashBtn">
      CONTINUE
    </button>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!-- Custom Modals Engine -->
<script src="js/modals.js"></script>
<!-- Game Controller script -->
<script src="js/lesson.js"></script>
</body>
</html>
