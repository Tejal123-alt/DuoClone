<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Goal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/onboarding.css">
    <link rel="stylesheet" href="../css/onboarding-animations.css">
    <!-- <link rel="stylesheet" href="../css/onboarding-animations.css"> -->
</head>

<body class="goal-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-sm-12">
                <div class="progress mt-4 mb-5">
                    <div class="progress-bar bg-success" style="width:15%"></div>
                </div>
                <div class="text-center">
                    <img src="https://cdn-icons-png.flaticon.com/512/616/616430.png"
             class="owl mb-4">
                    <!-- <span class="emoji-icon bounce" style="font-size:3rem;">🦉</span> -->
                    <i class="bi bi-briefcase emoji-icon me-2 bounce"></i>
                    <h2 class="main-title heading-lg">Choose your daily goal</h2>
                    <p class="subtitle">Practice every day to build a learning habit.</p>
                </div>
                <div class="goal-card card-gradient-1">
                    <h5 class="d-flex align-items-center"><i class="bi bi-mortarboard emoji-icon me-2 bounce"></i>Casual
                    </h5>
                    <p>5 minutes a day</p>
                </div>
                <div class="goal-card card-gradient-1">
                    <h5 class="d-flex align-items-center"><i class="bi bi-clock emoji-icon me-2 bounce"></i>Regular</h5>
                    <p>10 minutes a day</p>
                </div>
                <div class="goal-card card-gradient-1">
                    <h5 class="d-flex align-items-center"><i class="bi bi-lightning emoji-icon me-2 bounce"></i>Serious
                    </h5>
                    <p>15 minutes a day</p>
                </div>
                <div class="goal-card card-gradient-1">
                    <h5 class="d-flex align-items-center"><i class="bi bi-airplane emoji-icon me-2 bounce"></i>Intense
                    </h5>
                    <p>20 minutes a day</p>
                </div>
                <button id="goalContinueBtn" class="btn btn-success continue-btn w-100" disabled>
                    Continue
                </button>
                <!-- Decorative icons -->
                <div class="d-flex justify-content-center my-4">
                    <i class="bi bi-star emoji-icon me-2 bounce"></i>
                    <i class="bi bi-heart emoji-icon me-3 bounce"></i>
                    <i class="bi bi-music-note emoji-icon bounce"></i>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/onboarding.js"></script>
</body>

</html>
