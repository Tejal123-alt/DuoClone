<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reason</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/onboarding.css">
<link rel="stylesheet" href="../css/onboarding-animations.css">
</head>
<body class="reason-page">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-12">
            <div class="progress mt-4 mb-5">
                <div class="progress-bar bg-success" style="width:35%"></div>
            </div>
            <div class="text-center">
                <i class="bi bi-cat emoji-icon bounce"></i>
                <h2 class="main-title heading-lg">Why are you learning?</h2>
                <p class="subtitle">Choose the option that fits you best.</p>
            </div>
                <div class="reason-card card-gradient-2">
                    <i class="bi bi-airplane emoji-icon me-2 bounce"></i>Travel
                </div>
                <div class="reason-card card-gradient-2">
                    <i class="bi bi-mortarboard emoji-icon me-2 bounce"></i>School
                </div>
                <div class="reason-card card-gradient-2">
                    <i class="bi bi-briefcase emoji-icon me-2 bounce"></i>Career
                </div>
                <div class="reason-card card-gradient-2">
                    <i class="bi bi-people emoji-icon me-2 bounce"></i>Family &amp; Friends
                </div>
                <div class="reason-card card-gradient-2">
                    <i class="bi bi-palette emoji-icon me-2 bounce"></i>Culture
                </div>
                <div class="reason-card card-gradient-2">
                    <i class="bi bi-brain emoji-icon me-2 bounce"></i>Brain Training
                </div>
                <div class="reason-card card-gradient-2">
                    <i class="bi bi-star emoji-icon me-2 bounce"></i>Just For Fun
                </div>
                <button id="reasonContinueBtn" class="btn btn-success continue-btn w-100" disabled>Continue</button>
                <div class="d-flex justify-content-center my-4">
                    <i class="bi bi-star emoji-icon me-3 bounce"></i>
                    <i class="bi bi-heart emoji-icon me-3 bounce"></i>
                    <i class="bi bi-music-note emoji-icon bounce"></i>
                </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/onboarding.js"></script>
</body>
</html>
